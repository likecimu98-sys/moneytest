# TutorApp on its own subdomain.
# The apex domain reshay-istoriyu.ru now points at a different server, so the
# app is served from tutor.reshay-istoriyu.ru on this host instead of /tutor/.
# Lives at /etc/nginx/sites-available/tutor.reshay-istoriyu.ru (symlinked into
# sites-enabled). Certbot appends the TLS listener once DNS resolves.
server {
    listen 80;
    listen [::]:80;
    server_name tutor.reshay-istoriyu.ru;

    root /var/www/tutorapp;
    index index.html;

    # Sync API — same Node service on 127.0.0.1:8737 as before.
    # Keys travel in query strings, so keep them out of the access log.
    location /api/ {
        proxy_pass http://127.0.0.1:8737/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4m;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;
    gzip_min_length 1024;
}
